name: Alaska Award Flight Search

on:
  # Run every 10 minutes
  schedule:
    - cron: '*/10 * * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Alaska search
        run: python alaska.py

      - name: Display results and check for deals
        id: summary
        run: python .github/scripts/summarize.py

      - name: Send email notification
        if: steps.summary.outputs.has_deals == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔥 Alaska Award DEALS Found! (${{ steps.summary.outputs.deals_count }} deals)"
          to: a11223d@gmail.com
          from: Alaska Award Bot
          body: |
            ${{ steps.summary.outputs.CONTENT }}
            ---
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
